services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xoruwebv3-app
    ports:
      - "8000:80"
    environment:
      APP_ENV: dev
      APP_SECRET: docker-secret-change-me
      DATABASE_URL: mysql://root:root@db:3306/xoru_dator2?charset=utf8mb4
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: xoruwebv3-db
    restart: always
    environment:
      MYSQL_DATABASE: xoru_dator2
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/xoru_dator2.sql:/docker-entrypoint-initdb.d/1-xoru.sql:ro

volumes:
  mysql_data:
